<style>

*{
    margin: 0px;

}

form{

}
fieldset{
    padding: 10px;

}
fieldset legend{
    font-weight: bold;
}
button{
    display: flex;
    margin: 10px auto 0px auto;

    padding: 3px 30px;
    font-weight: bold;
    border-radius: 5px;
    border: solid black 1px;
}

</style>

<body>

        <fieldset>
            <legend>Dados User</legend>
            <label for="input-name">Digite seu Nome:</label>

            <br>
            <button type="submit" onclick="ativar()">Enviar Dados!</button>
            <p id="msg"></p>
        </fieldset>
    </form>    
    

<script src="script01.js"></script>
