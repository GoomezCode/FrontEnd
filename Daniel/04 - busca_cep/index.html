<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet"/>

    <link rel="stylesheet" href="style.css" />
    <title>Buscar Cep</title>
  </head>
  <body>
    <div class="container">

        <div class="campos">
            <fieldset>
                <legend>Usuario</legend>
                <label for="nome_user">Nome</label>
                <input type="text" id="nome_user" placeholder="Nome"/>

                <label for="username_user">Username</label>
                <input type="text" id="username_user" placeholder="Username">
                
                <label for="email_user">E-mail</label>
                <input type="text" id="email_user" placeholder="E-mail"/>            

                <label for="senha_user">Senha</label>
                <input type="text" id="senha_user" placeholder="*********">
            </fieldset>
            
            <fieldset>
                <legend>Endereco</legend>
                <label for="cep_user">Cep</label>
                <input type="text" id="cep_user" placeholder="CEP"/>
                
                
                <label for="endereco_user">Endereço</label>
                <input type="text" id="endereco_user" placeholder="Endereço"/>
                
                <label for="bairro_user">Bairro</label>
                <input type="text" id="bairro_user" placeholder="Bairro">
                
                <label for="localidade_user">Localidade</label>
                <input type="text" id="localidade_user" placeholder="Localidade">
            </fieldset>
        </div>
            
      <button type="button">Cadastrar</button>

      <script src="script.js"></script>
    </div>
  </body>
</html>
