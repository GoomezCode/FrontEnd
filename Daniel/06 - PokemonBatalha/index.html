<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Batalha Pokémon</title>
  </head>
  <body>
    <div class="container">
      <h1>Batalha de Pokémon</h1>

      <div class="campo">
        <fieldset>
          <legend>Treinador 1</legend>
          <div class="dados">
            <label for="nome_treinador_1">Nome do Treinador</label>
            <input type="text" id="nome_treinador_1" />

            <label for="nome_pokemon_1">Nome do Pokemon</label>
            <input type="text" id="nome_pokemon_1" />

            <label for="altura_pokemon_1">Altura do Pokemon</label>
            <input type="text" id="altura_pokemon_1" />

            <label for="peso_pokemon_1">Peso do Pokemon</label>
            <input type="text" id="peso_pokemon_1" />

            <label for="ataque_pokemon_1">Ataque Pokemon</label>
            <input type="text" id="ataque_pokemon_1" />
          </div>

          <img
            src="https://cdn-icons-png.flaticon.com/512/2175/2175188.png"
            alt="Pokemon"
            width="200px"
            height="200px"
          />
        </fieldset>

        <fieldset>
          <legend>Treinador 2</legend>
          <div class="dados">
            <label for="nome_treinador_2">Nome do Treinador</label>
            <input type="text" id="nome_treinador_2" />

            <label for="nome_pokemon_2">Nome do Pokemon</label>
            <input type="text" id="nome_pokemon_2" />

            <label for="altura_pokemon_2">Altura do Pokemon</label>
            <input type="text" id="altura_pokemon_2" />

            <label for="peso_pokemon_2">Peso do Pokemon</label>
            <input type="text" id="peso_pokemon_2" />

            <label for="ataque_pokemon_2">Ataque Pokemon</label>
            <input type="text" id="ataque_pokemon_2" />
          </div>

          <img
            src="https://cdn-icons-png.flaticon.com/512/2175/2175188.png"
            alt="Pokemon"
            width="200px"
            height="200px"
          />
        </fieldset>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
